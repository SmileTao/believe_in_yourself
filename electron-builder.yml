appId: com.shibie.app
productName: 士别三日
copyright: Copyright © 2026 shibie
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - resources/**
  - '**/node_modules/better-sqlite3/**'
extraMetadata:
  name: shibie
  main: out/main/index.js

# better-sqlite3 原生模块跨平台构建说明：
# 本机仅构建 mac dmg。Windows/Linux 包须在对应平台或 GitHub Actions 矩阵构建。

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  darkModeSupported: false
  hardenedRuntime: false

# —— 以下为三端预留配置（本阶段不实际打包）——
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Office
